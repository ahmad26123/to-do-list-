
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body class="bg-light">
    <!-- Navbar with Bootstrap Classes -->
    <div class="container my-3">
      <nav
        class="navbar navbar-expand-lg bg-body-tertiary rounded shadow-sm px-3"
      >
        <div class="container-fluid">
          <a class="navbar-brand fw-bold" href="#">Navbar</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a
                  class="nav-link active"
                  aria-current="page"
                  href="./index.html"
                  >Home</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./usres.html">Users</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./to-do-list.html">To_Do_List</a>
              </li>
            </ul>
            <form class="d-flex" role="search">
              <input
                class="form-control me-2"
                type="search"
                placeholder="Search"
                aria-label="Search"
              />
              <button class="btn btn-outline-success" type="submit">
                Search
              </button>
            </form>
          </div>
        </div>
      </nav>
    </div>

    <!-- Todo App Container with Bootstrap Grid & Card Classes -->
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card shadow border-0 p-4 rounded-4">
            <div class="todo-app">
              <h1 class="text-center mb-4 fw-bold text-primary">To-DO List</h1>

              <!-- Input Group Classes -->
              <form class="input-group mb-4">
                <input
                  type="text"
                  id="task-input"
                  class="form-control"
                  placeholder="Add a new task..."
                />
                <button type="submit" id="add-task-btn" class="btn btn-primary">
                  Add
                </button>
              </form>

              <div class="todos-container">
                <!-- List Group Class for Tasks -->
                <ul id="task-list" class="list-group mb-3"></ul>

                <div class="text-center">
                  <img
                    src="./images/slazzer-preview-jcm6f.png"
                    alt="empty"
                    class="empty-image img-fluid"
                    style="max-width: 140px"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./js/main.js"></script>
  </body>
</html>
