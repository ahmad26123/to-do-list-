<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body class="bg-light">
    <!-- Navbar with Bootstrap Classes -->
    <div class="container my-3">
      <nav
        class="navbar navbar-expand-lg bg-body-tertiary rounded shadow-sm px-3"
      >
        <div class="container-fluid">
          <a class="navbar-brand fw-bold" href="#">Navbar</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a
                  class="nav-link active"
                  aria-current="page"
                  href="./index.html"
                  >Home</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./usres.html">Users</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./to-do-list.html">To_Do_List</a>
              </li>
            </ul>
            <form class="d-flex" role="search">
              <input
                class="form-control me-2"
                type="search"
                placeholder="Search"
                aria-label="Search"
              />
              <button class="btn btn-outline-success" type="submit">
                Search
              </button>
            </form>
          </div>
        </div>
      </nav>
    </div>

    <!-- Todo App Container with Bootstrap Grid & Card Classes -->
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card shadow border-0 p-4 rounded-4">
            <div class="todo-app">
              <h1 class="text-center mb-4 fw-bold text-primary">To-DO List</h1>

              <!-- Input Group Classes -->
            <div class="d-flex justify-content-center mb-4">
              <button type="submit" id="add-task-btn" class="btn btn-primary btn btn-primary" data-bs-toggle="modal"
                data-bs-target="#staticBackdrop">
                  Add
                </button>
                </div>
                <!-- </form> -->

              <div class="todos-container">
                <!-- List Group Class for Tasks -->
                <ul id="task-list" class="list-group mb-3">
                  <div class="row">
                     <div class="col">
                       <div class="collapse multi-collapse" id="multiCollapseExample1">
                         <div class="card card-body">
                           Some placeholder content for the first collapse component of this multi-collapse example. This panel is hidden by default but revealed when the user activates the relevant trigger.
                         </div>
                       </div>
                     </div>
                </ul>

                <div class="text-center">
                  <img
                    src="./images/slazzer-preview-jcm6f.png"
                    alt="empty"
                    class="empty-image img-fluid"
                    style="max-width: 140px"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Button trigger modal -->
    <!-- <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#staticBackdrop">
                                      Launch static backdrop modal
                                    </button> -->
    
    <!-- Modal -->
    <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
      aria-labelledby="staticBackdropLabel" aria-hidden="staticBackdropLabel">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="staticBackdropLabel">Modal title</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
    
    
            <form id="task-form">
    
              <div class="input-group mb-3" id="task-title" name="task-title">
                <span class="input-group-text" id="basic-addon1">Task Title</span>
                <input type="text" class="form-control" placeholder="I have to ..." aria-label=""
                  aria-describedby="basic-addon1">
              </div>
    
    
    
              <div class="input-group mb-3" name="user-select" id="user-select"> 
                <label class="input-group-text" for="inputGroupSelect01">Usere</label>
                <select class="form-select" id="inputGroupSelect01">
                  <option selected>Choose...</option>
                <!--   <option value="1">One</option>
                  <option value="2">Two</option>
                  <option value="3">Three</option> -->
                </select>
              </div>
    
    
    
              <div class="input-group" id="task-description" name="task-description">
                <span class="input-group-text">Task Description</span>
                <textarea class="form-control" aria-label="With textarea"></textarea>
              </div>
    
    
    
    
    
    
              <button type="submit" class="btn btn-primary">Add Task</button>
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </form>
    
          </div>
        </div>
      </div>
    </div>
    </div>



    <SCRipt src="./js/server.js"></SCRipt>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./js/main.js"></script>
  </body>
</html>
